; Northlight renderer quality settings (frd9.dll 0.3.138 and later).
; Read once when the game starts: restart WoW after editing this file.
; The same file works on Windows and on Mac/Wine.
;
; On a slower PC, lower the quality to gain FPS. The renderer mostly waits on
; the CPU, so these settings remove CPU work from the game's main thread.
;   Quality     = full detail. This is the default (since 0.3.167 distant
;                 shadows every 4th frame, character shadows within 40 yards).
;   Balanced    = small, rarely visible reductions.
;   Performance = the largest CPU saving; shadows are a little simpler.
;
; "FPS impact" under each setting tells how much changing it can raise FPS on
; a CPU-limited PC: none, small (under ~0.3 ms per frame), moderate
; (~0.3-1.5 ms) or large (over ~1.5 ms). Preset: Performance vs Quality is large.
;
; The line "QUALITY ..." in northlight-renderer.log shows the values in use.
; A mistyped or out-of-range value is ignored (logged as "QUALITY warning")
; and the preset's value is used instead. Deleting this file = Quality.

[Quality]
Preset=Quality

; ---------------------------------------------------------------------------
; Optional overrides. Remove the leading ';' to replace the preset's value.
; Values shown are Quality / Balanced / Performance.
; ---------------------------------------------------------------------------

; Characters and creatures cast shadows nearest first, up to this many MiB of
; animated geometry. 0 = no limit (every captured character casts a shadow).
; Allowed 0..32. 0 / 16 / 8
; FPS impact: moderate in crowds (fewer characters drawn into the shadow maps),
;  none with few characters. 0 = no limit = most work.
;ActorShadowBudgetMiB=0

; Characters and creatures farther than this many yards from your character
; cast no shadow (checked before ActorShadowBudgetMiB, which then only counts
; the characters inside). The renderer does not know exactly where your
; character is: it measures from the character the camera keeps looking at
; (found again after loading or a teleport; until then nothing is filtered).
; Anything it is unsure about keeps its shadow. Your own character, its mount, weapons and other attachments
; normally keep theirs (zoomed far out behind a dense crowd, the renderer can
; mistake someone in front of you for you until you turn the camera). Values 1..3 all mean "your character and whatever stands
; on or right next to it". Buildings, terrain, trees placed on the map and
; single-part props are not affected, nor is the bounced light (GI); animated
; server objects (banners, event decorations) follow the same distance rule.
; Lamp shadows (PointShadows=1) of characters
; beyond the distance go too. A character near the edge keeps its shadow until
; about 2 yards (10%) beyond it, so shadows do not blink on and off there.
; 0 = no limit (every character casts a shadow).
; Allowed 0..200. 40 / 35 / 20
; FPS impact: moderate to large in crowds (e.g. 30: far fewer characters are
;  drawn into the shadow maps). The choice itself costs CPU on every frame
;  that draws character shadows, also with ActorShadowBudgetMiB=0 (where it
;  was free): about 0.1 ms with a few characters, up to about 1 ms in a large
;  crowd, so with few characters it can cost a little FPS.
;  0 = no limit = most shadow work, no selection cost.
;  Most useful at 10-40 in crowds; values above ~48 save little (only distant
;  shadows, which FarShadowInterval already redraws rarely) and above ~190
;  nothing at all, while the selection cost remains.
;ActorShadowRadius=40

; Actor shadows. 1 = characters and moving objects cast the renderer's shadows
; (as before). 0 = static shadows only: terrain, buildings, and trees and
; props placed on the map keep theirs. Lost with 0: characters, creatures,
; mounts and pets (your own character too), and objects the server places,
; such as doors, elevators, ships and zeppelins, mailboxes, chests and event
; decorations. Swaying trees, windmills, banners and flags keep a frozen
; shadow in their resting pose. With 0 the game's own round blob shadows under
; characters are drawn as the game makes them; with 1 they follow
; BlobShadowStrength (below). Ctrl+Shift+F9 still turns all of the renderer's
; shadows off.
; With 1, small still objects the server places (shop signs, event fences)
; keep their shadow when the camera turns away from them or a crowd fills the
; view, once they have stood still for about 2 seconds within about 70 yards.
; The shadow goes when you look at the spot from within 25 yards and the object
; is gone (after about a second), or when you are more than 80 yards away; an
; object that vanishes farther away keeps its shadow until then. Weapons and
; other items held by characters are never kept.
; With GIDynamicProbes=1 the characters are still copied for the bounced light
; about every 200 ms (a small regular hitch in crowds is possible);
; GIDynamicProbes=0 removes that copy too. 0 also turns ShadowFateDiagnostics
; and DiagReplayProbe off (logged).
; No preset changes it. Allowed 0..1. 1 / 1 / 1
; FPS impact: large in crowds (about 4-5 ms per frame), about 1 ms in quiet
;  areas.
;ActorShadows=1

; Experimental nearby grass shadow casters. Requires ActorShadows=1 and
; shadows enabled. 0 = no additional grass capture/replay work; 1 = native
; alpha-cut detail doodads cast shadows within 64 yards, bounded to 32 draws,
; 8192 vertices and 512 KiB capture input per frame. Receiver diagnostics remain
; available with either value. Restart WoW after changing this setting.
; Allowed 0..1. Quality / Balanced / Performance: 1 / 0 / 0
; FPS impact: not yet measured in-game.
;GrassShadows=1
; Northlight Quality upgrade: grass-shadows GrassShadows=1 ActorShadows=1 CommandStream=1

; Native round ground shadows under characters, creatures and mounts.
; 0 hides only this decal, even without detailed character shadows or an active
; sun/moon shadow source. 1 preserves the existing behavior. Detailed and local
; light shadows are unaffected. Ctrl+Shift+F10 still restores the native image.
; Live setting. Allowed 0..1. Quality / Balanced / Performance: 1 / 1 / 1
;BlobShadows=1

; Round blob shadows under characters (0.3.193). The game draws a round dark
; spot under every character; the renderer's own shadows now come on top of it,
; so it is shown fainter. 100 = the game's own spot, unchanged. 0 = hidden.
; 1..99 = drawn with a lighter picture, the higher the darker (the spot is hidden
; if the game's blend cannot be lightened). This only applies
; while the renderer's actor shadows are on (ActorShadows=1, effects and
; Ctrl+Shift+F9 shadows on); otherwise the game's spot is untouched.
; BlobShadows=0 hides the spot regardless of this strength; the value is retained.
; Live setting. No preset changes it. Allowed 0..100. 50 / 50 / 50
; FPS impact: not measured: a cached texture check on small draws and two
;  SetTexture calls per blob draw, as in 0.3.192 and earlier; 100 skips it.
;BlobShadowStrength=50

; Tiny animated parts below this many triangles cast no shadow (e.g. small
; attachments). 0 = all parts cast shadows. Allowed 0..500. 100 / 150 / 180
; FPS impact: large. The biggest single lever measured (Mac test: 89 -> 102 FPS
;  at 150).
;MinSkinnedTriangles=100

; Distant sun/moon shadows (beyond about 48 yards) are redrawn every N frames
; instead of every frame (NearShadowInterval sets the near ones).
; Distant moving shadows (characters) then lag by up to N-1 frames
; (at 16: about 0.25 s at 60 FPS, 0.75 s at 20 FPS).
; Allowed 1..16. 4 / 5 / 6
; FPS impact: moderate; larger together with NearShadowInterval 2 or more.
;FarShadowInterval=4

; Moving shadows near the player (within about 48 yards: characters, creatures,
; swaying trees) are redrawn every N frames; they lag by up to N frames
; (at 2: up to two frames, about 33 ms at 60 FPS; the shadow of a fast-moving
; character can step visibly at low FPS). Buildings and
; terrain are not affected. When BOTH intervals are 2 or more, frames that
; need neither shadow redraw also skip copying the characters' geometry
; (about 1-1.5 ms of CPU per skipped frame); FarShadowInterval as a multiple of
; this value gives the most such frames. Frames then alternate between
; lighter and normal ones: average FPS rises, the slowest frames do not.
; With shadows off (F9) that copy runs only for the bounced light (GI),
; whatever these values are.
; Allowed 1..16. 1 / 2 / 2
; FPS impact: large at 2 or more (with FarShadowInterval 2 or more): about half
;  of the frames skip shadow redraw and character capture (Mac test, Durotar:
;  mod cost 7 -> 5.6 ms per frame).
;NearShadowInterval=1

; How many nearby lamps and torches light the scene at once.
; Lamps in view take the slots first; nearby lamps on screen share passes.
; The GPU budget never lowers this. Extra lamps increase GPU work.
; Allowed 8..128. 48 / 32 / 24
;LocalLightLimit=48

; Shadows from selected compact local sources, including supported street lamps,
; torches and braziers. Enabled day and night; source visibility and sunlight
; control the correction. Diffuse glows are excluded. 1 / 1 / 1
; FPS impact depends on the selected source count, geometry and refresh budget.
;PointShadows=1

; Minimum time in milliseconds between lamp shadow updates (PointShadows=1 only). 0 = every frame
; (as today, except in crowds). Allowed 0..100. 0 / 33 / 33
; FPS impact: small to moderate at night near lamps, none in daylight.
;PointShadowRefreshMs=0

; How many of the lamp shadow's six directions are redrawn per frame. 6 = all
; six in one frame (as 0.3.150). Lower values spread one update over several
; frames: a character crossing the edge between two directions can then show
; its shadow at two slightly different poses there for a frame or two. A lamp
; that moves, changes range or is replaced still redraws all six at once.
; Allowed 1..6. 6 / 6 / 6
; FPS impact: small to moderate at night near lamps in crowds (smaller spikes
;  when lamp shadows update), none in daylight.
;PointShadowFacesPerFrame=6

; Sun/moon direction steps for cached shadows. Fewer steps redraw the cached
; shadows less often as the sun moves (fewer short stutters); the shadow then
; moves in slightly larger steps. Allowed 256..2048. 2048 / 2048 / 2048
; FPS impact: small on average; fewer steps = fewer short stutters while the
;  sun moves.
;ShadowDirectionSteps=2048

; When buildings, trees or other placed models appear or disappear, the part of
; the cached sun/moon shadow they touch is redrawn over this many frames
; instead of one. The new or removed shadow then appears up to N-1 frames late,
; one band at a time. 1 = in one frame (as 0.3.150). Allowed 1..4. 1 / 1 / 1
; FPS impact: none on average; smaller short stutters while models stream in.
;StaticCacheSlices=1

; Animated-geometry capture ceiling in MiB. Lower values drop characters in
; draw order (not by distance); prefer ActorShadowBudgetMiB.
; Once the ceiling is reached, your own character, its mount and anything
; standing on the camera's line of sight to them may still use a separate
; 4 MiB reserve, so they keep their shadow in front of a large crowd (0 while
; the renderer is short of memory).
; Allowed 1..32. 32 / 32 / 32
; FPS impact: small; only matters in very large crowds.
;CaptureBudgetMiB=32

; --- Global illumination (bounced light), solved on a background thread ---

; 1 = on, 0 = off. Off also stops the background probe solving and the
; character capture it needs (F8 only hides it). 1 / 1 / 1
; FPS impact: small on the game thread; 0 also frees a background CPU core
;  (helps on 2-4 core CPUs).
;GI=1

; Rays per light probe. Fewer rays = less background CPU, slightly noisier
; bounced light. Allowed 16..64. 64 / 48 / 32
; FPS impact: none on the game thread; background CPU only (matters on 2-4 core
;  CPUs).
;GIRays=64

; Light bounces per ray. 2 is slightly darker in deep interiors.
; Allowed 1..3. 3 / 3 / 2
; FPS impact: none on the game thread; background CPU only (matters on 2-4 core
;  CPUs).
;GIBounces=3

; Distance in yards the camera moves before the probes follow it.
; Allowed 8..16. 8 / 8 / 16
; FPS impact: none to small (less background work while moving).
;GIProbeMoveStep=8

; Characters add their own bounced light and shadowing to nearby probes
; (1 = on). 0 also skips capturing characters for this. 1 / 0 / 0
; FPS impact: small (0 skips capturing characters for GI).
;GIDynamicProbes=1

; Threads that solve probes. Raise only on a CPU with spare cores (e.g. 6+);
; the result is identical, it only arrives sooner. Allowed 1..4. 1 / 1 / 1
; FPS impact: none; more threads can cost FPS on a CPU with few cores.
;GIThreads=1

; Ray tracer for GI: 1 = the faster 0.3.138 tracer, 0 = the 0.3.137 tracer
; (for comparing the two); the lighting should look the same. 1 / 1 / 1
; FPS impact: none on the game thread; 1 uses less background CPU.
;GIFastBVH=1

; Strength of the bounced light (GI) in percent. 60 = the standard strength;
; lower is flatter/closer to the game's own ambient light, higher gives stronger
; bounce colour and darker occlusion (100 = maximum, about 1.7x the standard).
; Allowed 0..100. 60 / 60 / 60
; FPS impact: none (picture only).
;GIStrength=60

; How far the bounced light (GI) reaches around the camera, in yards. The value
; snaps down to 36, 44, 52, 60, 68, 76 or 84; Quality uses 76, Balanced and
; Performance 52 (the reach before 0.3.167). Above 52 the background GI work
; grows to about 1.3x (60), 1.65x (68), 2x (76) and 2.5x (84),
; newly entered areas fill in more slowly, and a little more memory is used.
; Allowed 36..84. 76 / 52 / 52
; FPS impact: small (a larger GI texture is updated while moving); background
;  CPU grows with the reach.
;GIDistance=76

; Moves the GI area ahead of the camera, toward your character, by this many
; yards. The camera sits about 15-27 yards behind the character, so about half
; of the GI area is normally behind the camera. Values near the camera distance
; (about 15-25; 20 suggested) give GI further ahead of the character and also
; reduce background GI work when turning the camera; large values (40+) add
; background work when turning. Turning the camera may shift the GI area.
; 0 = centred on the camera (standard). Allowed 0..48. 0 / 0 / 0
; FPS impact: none on the game thread; background CPU only.
;GIProbeAhead=0

; --- Horizon haze (picture only) ---

; Soft haze on the far landscape and on the lowest few degrees of the sky,
; in the game's own fog colour (slightly warmer toward a low sun). Terrain
; nearer than HorizonHazeStart percent of the game's fog distance is never
; changed. The fog switch Ctrl+Shift+F7 also turns it off (on a Mac, first
; remove macOS's own Control+F7 shortcut in System Settings > Keyboard).
; Strength in percent. 0 = off (the picture of 0.3.153). Allowed 0..100.
; 50 / 50 / 50
; FPS impact: small (one short calculation per far or sky pixel on the GPU).
;HorizonHaze=50

; Where the haze begins on terrain, in percent of the game's own fog distance
; for the zone. Where that fog cannot be read (e.g. some city views), the last
; known fog distance on this map is kept; before the game's fog is first seen
; after login or a map change, the haze is off. Raise to 85-95 if the haze
; reaches too far into the landscape. Allowed 50..95. 75 / 75 / 75
; FPS impact: none.
;HorizonHazeStart=75

; How high the haze climbs the sky, in degrees above the horizon.
; Allowed 2..15. 6 / 6 / 6
; FPS impact: none.
;HorizonHazeBand=6

; 1 = haze on distant terrain and the sky band, 0 = the sky band only.
; 1 / 1 / 1
; FPS impact: none.
;HorizonHazeTerrain=1

; --- Diagnostics (log only; the picture is identical either way) ---

; 1 = record why character shadows appear/disappear ("SHADOW fate" lines in
; northlight-renderer.log, with ActorShadowBudgetMiB above 0). Costs about
; 0.2-0.5 ms per frame during a 120-frame window every 1200 frames. 0 / 0 / 0
; FPS impact: small (0.2-0.5 ms per frame during its sampling window); keep 0
;  for play.
;ShadowFateDiagnostics=0

; 1 = periodic statistics in northlight-renderer.log (as before). 0 = only the
; start-up lines, settings and errors are written, and the timing/statistics
; work behind the periodic lines is skipped. The picture is identical.
; Also turns ShadowFateDiagnostics off. 0 / 0 / 0
; FPS impact: small on average, but a periodic line can cost a few ms on one
;  frame; keep 0 for play and set 1 when reporting a problem.
;Diagnostics=0

; Measurement only (0.3.149), needs Diagnostics=1: 1 = render-thread timing
; lines in northlight-renderer.log (FRAME cost, WORLD replay split, D3D calls,
; WORLD profile frame). The picture is identical. 0 / 0 / 0
; FPS impact: a few timer reads per frame; keep 0 for play.
;RenderProfile=0

; Measurement only (0.3.149), needs RenderProfile=1: 1 = in 10-second windows,
; draw the near sun shadow's character draws a second time into a hidden
; target and log the time ("WORLD replay probe" lines). The picture is
; identical. 0 / 0 / 0
; FPS impact: up to one extra near-shadow pass per frame; keep 0 for play.
;DiagReplayProbe=0

; Memory diagnostics (task 42): 1 = "MEMMAP" address-space snapshots in
; northlight-renderer.log at start-up, world entry, memory pressure, every 10
; minutes and shutdown (walks the whole address space; the world-time ones run
; on a background thread). 0 = none: no walks, no lines, no work. The picture
; is identical. 0 / 0 / 0
; FPS impact: none when 0; keep 0 for play and set 1 when reporting a memory problem.
;MemMap=0

; Fallback switch (0.3.187): 1 = the renderer decides once per frame whether
; its sun/moon, round-shadow and terrain-shadow work can apply, and skips
; checking every draw of the game when it cannot. 0 = check every draw as
; before 0.3.187. The picture is identical. 1 / 1 / 1
; FPS impact: not measured yet (expected small, CPU only); keep 1 unless asked
;  to compare.
;FrameDrawGates=1

; Shadow detail near the player (0.3.190): the sharp near shadow map is centred
; where the camera looks, at the distance of your character. After a mouse
; wheel zoom or when the camera is pushed in by a tree or wall, that distance
; went stale and shadows around you (tree shadows mostly) dropped to the coarse
; distant map. 1 = the distance follows the camera and your character at once.
; 0 = the old behaviour, for comparisons. 1 / 1 / 1
; FPS impact: none.
;ShadowPivotCorrection=1

; Command stream (0.3.192): 1 = the game only records its graphics calls and a
; second thread runs the renderer and the graphics driver layer, so the game's
; own thread spends less of each frame waiting on the picture. The game runs
; at most StreamFramesAhead frames ahead of what is on screen (below). 0 =
; everything on the game's thread as before 0.3.192, for comparisons or if a
; problem appears. Read once when the game starts. If the second thread cannot
; start, 0 is used. 1 / 1 / 1
; FPS impact: expected to raise FPS when the game is limited by one CPU core;
; uses one more core. Not measured on every machine yet.
;CommandStream=1

; Frames ahead (0.3.200, CommandStream=1): how many frames the game may record
; before the second thread has drawn them. 2 lets the game start the next frame
; while the previous one is still being drawn, so short spikes on either thread
; stop costing frames; the picture can show the game's state up to that many
; frames late (2: about 33 ms at 60 FPS) and the stream may use up to 16 MiB
; more memory (32 MiB at most). 1 = as in 0.3.199. Read once when the game
; starts. Allowed 1..3. 2 / 2 / 2
; FPS impact: expected to raise FPS when the game and the renderer thread take
; turns; not measured on every machine yet.
;StreamFramesAhead=2

; Frame skip (0.3.200, CommandStream=1): 1 = when the second thread has fallen
; two whole frames behind the game, it skips drawing the older of them (its
; uploads and settings still apply, nothing is lost) instead of making the game
; wait, so the game keeps its pace and the picture catches up. Frames that
; draw into textures (water, minimap, portraits), use occlusion tests or copy
; the picture are always drawn, and at least every third frame is shown.
; 0 = every frame is drawn, as before. Read once when the game starts.
; 1 / 1 / 1
; FPS impact: none while the renderer keeps up; when it cannot, the game's own
; frame rate stays up and fewer of its frames are shown.
;StreamFrameSkip=1

; Glare query (CommandStream=1): the game asks the graphics card how much of the
; sun or moon is visible (to fade its glare) and waits for the answer, which
; made the game wait for the second thread several times a second. 1 = the
; answer is the latest one the second thread has already measured (at most a
; frame or two old; the very first one is still waited for). 0 = always wait,
; as before. Read once when the game starts. 1 / 1 / 1
; FPS impact: removes a per-frame wait on the game's thread; none otherwise.
;StreamOcclusionLocal=1

; Weather. With 1 the renderer's own effects follow rain and snow that the
; game's own weather state shows (read from the game's memory, plain reads and
; nothing is hooked; when that read fails, the draws of the Northlight art
; layer's weather textures are the fallback): the horizon haze and the
; fog thicken, light shafts, the sun and moon discs and the sun veil fade,
; shadows soften, sky light rises a little and lamps glow more in the fog. The
; game's rain streaks are drawn alpha-blended (crisp, their own colour) and its
; mist puffs (black balls in night and storm rain) are left out while it rains;
; snow and sand storms keep them. 0 = nothing reacts, the game's own rain.
; Needs the art layer (patch-z). 1 / 1 / 1
; Camera weather can add a separate pass when enabled and visible.
;Weather=1

; How strongly rain and snow thicken the renderer's own fog, haze, shafts,
; sun and moon and soften shadows (Weather=1). 0 = no change from rain or snow,
; 1 = the tuned look, 2 = twice as strong (snow acts at 60 percent of rain).
; Allowed 0..2. 1 / 1 / 1
;RainFog=1

; Moving refractive droplets and trails on the camera during outdoor rain.
; Requires Weather=1 and a confirmed outdoor view. 1 / 1 / 1
;RainLens=1

; Camera rain strength in percent. Allowed 0..100. 60 / 60 / 60
;RainLensStrength=60

; Soft ice flakes adhere and melt on the camera during outdoor snow.
; Requires Weather=1 and a confirmed outdoor view. 1 / 1 / 1
;SnowLens=1

; Camera snow strength in percent. Allowed 0..100. 60 / 60 / 60
;SnowLensStrength=60

; Fog clouds: low fog banks that drift with the wind, drawn in their own
; half-resolution pass (thicker and faster in rain, few and faint in clear
; weather, fainter still at night; without rain only in forest and grass zones). Ctrl+Shift+F7 (fog) and F10 turn them off with the rest.
; 0 = none, 1 = on. Allowed 0..1. 1 / 1 / 0
;FogClouds=1

; How much of the ground the fog clouds cover, in percent (FogClouds=1).
; 0 = none, 100 = the tuned look, 200 = twice as much. Allowed 0..200. 100 / 100 / 100
;FogCloudDensity=100

; GPU budget in milliseconds per frame for Northlight's own effects. The
; renderer measures the graphics card time its passes take (a few frames late,
; never waiting for it); while that stays above this budget for about half a
; second it lightens the heaviest passes one step at a time: fewer fog cloud
; steps in two stages, then fewer fog steps (lamps are never cut: they cost
; little). When the time stays well under the budget, or the graphics card
; is not what limits the frame rate, for a few seconds the full picture comes
; back one step at a time. 0 = off: always the full picture,
; nothing is measured. Allowed 0..20. 4 / 3 / 2
; FPS impact: none while under the budget; over it, raises FPS when the
; graphics card is the limit (a 1728x1117 Mac measured about 3 ms).
;GpuBudgetMs=4

; CPU budget in milliseconds per frame for Northlight's own effects on the
; renderer thread (task 45). The renderer measures how long its effects take
; each frame (the shadow maps, including the character shadows, and the
; passes; not the capture of the game's draws) and, while that stays above
; this budget for about half a second AND Northlight's render thread is
; what limits the frame rate, shrinks the radius of the character shadows in three
; steps: 30, 20 and 12 yards (never larger than ActorShadowRadius; with
; ActorShadowRadius=0 the first step gives 30). When the time stays well
; under the budget, or the render thread is not the limit, for a few seconds
; the set radius comes back one step at a time. The graphics
; card counts as the limit while the renderer thread keeps waiting for it
; before showing a frame (known with CommandStream=1 and StreamFramesAhead
; of 2 or more). The render thread counts as the limit only while the game
; itself keeps waiting for it, or the render thread skips frames to catch up
; (StreamFrameSkip=1), with CommandStream=1; if the game is busy
; longer than the render thread, a smaller radius would not raise FPS and
; the radius stays. With CommandStream=0 only the graphics card test applies.
; 0 = off: the radius is always ActorShadowRadius. Allowed 0..20. 3 / 3 / 2
; FPS impact: none while under the budget; over it, raises FPS in crowded
; places where the processor is the limit (measured: about 200 characters
; in range cost over 3 ms of the renderer thread's time).
;ActorShadowCpuMs=3

; Replay jobs (0.3.200): 1 = the renderer thread hands some of its per-frame
; CPU work to a few helper threads (1 to 4, by the number of CPU cores): the
; choice of the nearby lamps and their screen areas, the fog clouds and the
; fog toward the sun, the terrain under the sun and moon shadows and the
; culling of character shadows for the later shadow maps. Each result is
; picked up right before the graphics calls that need it; the picture is
; exactly the same. 0 = all of it on the renderer thread as before 0.3.200,
; for comparisons. 1 / 1 / 1
; FPS impact: expected to save a part of a millisecond of the renderer
; thread's time per frame where it is the limit; uses spare cores. Not
; measured on every machine yet.
;ReplayJobs=1

; Contact shading (0.3.201): the darkening in creases and corners (under
; collars and cloth folds, where walls meet floors) that the renderer computes
; from the depth picture and then smooths in its own pass. 1 = on (default);
; 0 = off: neither the shading nor its smoothing is computed, the bloom glow
; stays, and nothing else changes. Read once when the game starts.
; Allowed 0..1. 1 / 1 / 1
; FPS impact: 0 saves about 0.5 ms of graphics card time per frame.
;ContactAO=1

; Night brightness: gives back the night ambient light the lighting layer
; takes away, so nights are not too dark. 0 = Northlight's full night
; darkness; 100 = the original game's night ambient; default 50, halfway. It is added like
; light, so shadows, lamps and colours keep their contrast. It fades in with
; sunset and out with sunrise; daytime, the sky and water are unchanged, and
; so are places without a sky of their own (dungeons, raids).
; Allowed 0..100. 50 / 50 / 50
; FPS impact: none (picture only).
;NightBrightness=50

; Actor shadow detail (0.3.209): characters, mounts and other moving casters
; near you get their own shadow map, four times finer than the near shadow,
; and a soft filter that is sharp where the shadow touches the caster and
; softer further away. 1 = on (default); 0 = the earlier look: moving
; casters are drawn into the near shadow map and blurred by its fixed filter.
; ActorShadows=0 turns it off as well.
; Allowed 0..1. 1 / 1 / 0
; FPS impact: small; 0 skips the extra shadow map and the filter pass.
;ActorShadowDetail=1

; Spell layer (task 34): particles, ribbons, translucent spell models and
; projected ground effects are drawn by the game before Northlight's world
; effects, so fog, haze, shadow and contact shading were computed from the
; picture behind them and tinted them. 1 = they are held back and drawn right
; after the effects, with the game's own colour, fog and soft edges, against
; the final depth (so objects in front still hide them); if anything unusual
; happens in a frame (a copy of the picture, a clear, a texture or vertex
; buffer written in a way that cannot be followed), that frame draws them the
; old way and the layer rests for 30 frames. Water, rain and floating names
; drawn after a held-back effect end the holding for that frame in the same
; way (original look), as does every other draw the layer cannot keep in
; order. Every such frame is followed by 30 frames without holding back
; (to avoid flicker). Game glow (ffxGlow 1) is let through: its copy of the
; picture and its full-screen glow pass do not end the holding; the held-back
; effects are drawn after the glow, so they get no game glow (they keep their
; own colour over the desaturated world, as a ghost would). 0 = off: exactly
; the old path, the old look, no extra work at all. Read once when the game
; starts.
; Allowed 0..1. 1 / 1 / 1
; FPS impact: CPU time on the thread that executes the device (the replay
; thread with the command stream on): roughly 0.5 us to record and 0.8 us to
; replay per held-back effect draw, about 3 ms per frame with ~2300 held-back
; draws in a very large crowd and about 0.1 ms in normal play. The GPU cost
; against the original in-place draws has not been measured.
;SpellLayer=1

; Spell fog: the held-back effects are drawn after Northlight's fog, so without
; this they would miss it. 1 = each held-back effect is drawn with the game's own
; fog, folded at record time with Northlight's fog along the view direction (the
; regional haze, rain, ground fog and fog clouds): a fitted replacement of the
; effect's fog constant, and for alpha-blended effects the fog colour toward the
; fog's in-scatter. No extra pass and no extra state change per effect. It is an
; approximation (the camera's heading stands for every pixel of the effect; effects
; further than 128 units keep the fog of 128; the horizon haze is not folded, the
; in-scatter colour is the sky ambient only, and the estimate follows the camera
; with a quarter-second smoothing), only effects whose vertex shader is proven to
; take its fog from the game's ramp are fogged (the alpha colour only for straight
; alpha blending), and fixed-function effects (ribbons, beams) are not. 0 = exactly the recorded game values. Needs
; SpellLayer=1. Read once when the game starts.
; Allowed 0..1. 1 / 1 / 1
; FPS impact: none measurable (one small fit per frame).
;SpellFog=1

; Depth test detection. The game never switches Z testing off; its draws that
; ignore depth (UI, sun and moon glare, some effects) run with the depth
; comparison set to ALWAYS. 1 = such draws are recognised: the effect layer
; holds back only effects that really test depth (a world draw that ignores
; depth while effects are held back flushes them, so that frame is drawn the
; old way and the layer pauses briefly), and the UI-boundary fallback for font mods also
; requires the UI's depth setting. 0 = Z testing is judged by the on/off flag
; only, as before. Allowed 0..1. Read once when the game starts. 1 / 1 / 1
; FPS impact: none measurable (one state read per effect draw).
;DepthFuncAware=1

; Weather from the game's memory. 1 = the weather effects follow the game's own
; weather state (type including sand, intensity), read from its memory with plain
; reads and nothing hooked; it counts on frames where the sky is drawn (indoors the
; game draws no weather and the effects fade out), and the Northlight art layer's
; weather textures stay the fallback when the read fails. 0 = only the draws of
; those textures decide, as before. Allowed 0..1. 1 / 1 / 1
; FPS impact: none measurable (a few small memory reads per frame).
;WeatherMemory=1

; Name mask (0.3.212): floating unit names and other world text are drawn by
; the game inside the 3D scene, so the lighting, shadows, contact darkening,
; bloom and fog of the scene used to darken and haze them. 1 = the pixels of
; a name are marked while the game draws it and the scene composite leaves
; them exactly as the game drew them (a later solid object drawn over a name
; still covers it normally). The pixels marked are exactly the ones the game's
; own name draw writes, so there is no threshold to set; 0 = off, as before 0.3.212. Needs a stencil
; buffer in the game's depth buffer (the 24-bit depth is created with 8
; stencil bits when the graphics driver allows; if the game itself uses
; stencil, the mask switches itself off). Read once at start.
; Allowed 0..1. 1 / 1 / 1
; FPS impact: none to negligible (a few render state changes per run of names).
;NameMask=1

; Diagnostic view: 1 = the pixels NameMask marked are painted 50 percent
; magenta over the finished frame. Allowed 0..1. 0 / 0 / 0
; FPS impact: one extra full-screen pass while on.
;NameMaskDebug=0

; An older shadow-experiment.ini is still honoured with Preset=Quality (as
; before this file existed). Balanced and Performance use their own values
; instead of it. A value set in this file always wins.

; Experimental native M2 point-light bridge. Uses the actual animated RGB and
; world position supplied by the game (including native bone-attached lights).
; Proven additive particles also contribute with CommandStream=1, only while
; drawn; missing uploads and unsupported shaders/ribbons stay unlit. Adds at
; most 8 nearby sources through the existing local-light limit, with 100 ms fade
; and 250 ms expiry; static lamps are deduplicated. Range is a bounded visual
; approximation of the native attenuation. Requires an in-game visual check.
; No GPU readback; at most 16 distinct constant banks / 64 attempts per frame.
; Native item, mount and spell light records share this bridge and its caps.
; Live particles share the cap but have no native-light fade or expiry tail.
; Read once at start. Allowed 0..1. 1 / 0 / 0
;EquipmentLights=1
; Northlight Quality upgrade: equipment-lights EquipmentLights=1 CommandStream=1

