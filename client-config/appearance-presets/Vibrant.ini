# Opt-in world appearance palette. Values are first-pass art direction, not in-game approval.

# Fog tint colours the existing game fog. The regional LUT grades the world after fog and water, before the HUD.

# Global fallback stays neutral so unknown and test maps do not inherit a look.

[default]
fog_tint = 1,1,1
fog_tint_strength = 0
shadow_contrast = 0
tone_curve_strength = 0
day_vibrance = 0
night_vibrance = 0

# Eastern Kingdoms: gentle day/night vibrance; exact regional fog colours follow active Light.dbc bands where available.
[Azeroth:default]
tone_curve_strength = 0.42
day_vibrance = 0.18
night_vibrance = 0.11

# Kalimdor: gentle day/night vibrance; exact regional fog colours follow active Light.dbc bands where available.
[Kalimdor:default]
